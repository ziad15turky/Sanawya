<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الثانوية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #111827 0%, #0f172a 100%);
            color: #f3f4f6;
            padding: 30px;
            border: 2px solid #3b82f6;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
            position: relative;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 20px;
                border-radius: 15px;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .header .main-title {
            font-size: 40px;
            font-weight: 900;
            background: linear-gradient(to left, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* زر تغيير الشعبة */
        .change-branch-btn {
            position: absolute;
            top: -10px;
            left: 0;
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
        }

        .change-branch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        .change-branch-btn.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header .main-title {
                font-size: 28px;
            }

            .change-branch-btn {
                position: absolute;
                top: -5px;
                left: 0;
                padding: 8px 15px;
                font-size: 13px;
            }
        }

        /* شاشة اختيار الشعبة الأولى */
        .selection-screen {
            text-align: center;
            padding: 40px 10px;
        }

        .selection-screen h3 {
            font-size: 22px;
            color: #e5e7eb;
            margin-bottom: 25px;
        }

        .branch-btn {
            background: #1e293b;
            color: #60a5fa;
            border: 2px solid #334155;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
            max-width: 300px;
        }

        .branch-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .branch-btn {
                width: 90%;
                padding: 12px 20px;
                font-size: 16px;
            }
        }

        /* لوحة التحكم والمواد (مخفية في البداية) */
        .main-dashboard {
            display: none;
        }

        .total-progress-section {
            background: rgba(59, 130, 246, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-bg {
            background: #111827;
            height: 14px;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            height: 100%;
            width: 0%;
        }

        /* حاوية الأكورديون وبار الإنجاز الخارجي */
        .subject-accordion {
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1f2937;
            background: #1e293b;
        }

        .outer-progress-box {
            padding: 10px 20px 0px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .outer-bar-bg {
            width: 70%;
            background: #111827;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .outer-bar-bg {
                width: 50%;
            }
        }

        .outer-bar-fill {
            background: #10b981;
            height: 100%;
            width: 0%;
        }

        /* حاوية الأوسمة الفردية لكل مادة */
        .subject-badges-container {
            padding: 8px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid #374151;
            min-height: 32px;
        }

        .subject-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #374151;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .subject-badge.unlocked {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #fcd34d;
            font-weight: 600;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        .accordion-header {
            padding: 15px 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion-header.active {
            color: #60a5fa;
            border-bottom: 1px dashed #334155;
        }

        .accordion-content {
            display: none;
            background: #111827;
            padding: 10px 15px;
            overflow-x: auto;
        }

        /* الجداول الداخلية */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            min-width: 500px;
        }

        tr {
            background: #1e293b;
        }

        tr:hover {
            background: #222f44;
        }

        td {
            padding: 12px;
            font-size: 14px;
            text-align: center;
        }

        td:first-child {
            border-radius: 0 8px 8px 0;
            text-align: right;
            padding-right: 15px;
        }

        td:last-child {
            border-radius: 8px 0 0 8px;
            color: #9ca3af;
            font-size: 12px;
        }

        .pdf-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
        }

        .pdf-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        /* ستايل عند الإنجاز */
        tr.completed {
            background: rgba(16, 185, 129, 0.15) !important;
        }

        tr.completed td {
            text-decoration: line-through;
            color: #64748b !important;
        }

        tr.completed .pdf-link {
            color: #64748b !important;
            text-decoration: line-through;
        }

        .checkbox-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            margin-left: 12px;
            display: inline-block;
            vertical-align: middle;
            cursor: pointer;
        }

        tr.completed .checkbox-dot {
            background: #10b981;
            border-color: #10b981;
        }

        .exam-row {
            background: linear-gradient(90deg, #1e1b4b 0%, #1e293b 100%);
        }

        /* رسائل التشجيع التلقائية */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 700;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            opacity: 0;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .toast-notification {
                bottom: 10px;
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div id="toast" class="toast-notification">عاش يا بطل! استمر 💪</div>

<div class="dashboard-container">
    
    <div class="header">
        <button id="changeBranchBtn" class="change-branch-btn" onclick="resetBranch()">تغيير الشعبة 🔄</button>
        <div class="main-title">تحدي الثانوية 🎯</div>
    </div>

    <div id="selectionScreen" class="selection-screen">
        <h3>مرحباً بك يا بطل، اختر شعبتك الدراسية لبدء التحدي:</h3>
        <button class="branch-btn" onclick="selectBranch('math')">📐 علمي رياضة</button>
        <button class="branch-btn" onclick="selectBranch('science')">🧪 علمي علوم</button>
        <button class="branch-btn" onclick="selectBranch('arts')">📚 أدبي</button>
    </div>

    <div id="mainDashboard" class="main-dashboard">
        <div class="total-progress-section">
            <div class="progress-info">
                <span>🚀 إجمالي التقدم في جميع المواد:</span>
                <span id="total-counter">0%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="total-filler"></div>
            </div>
        </div>

        <div id="accordionsContainer"></div>
    </div>

</div>

<script>
    // المواد وتواريخها مقسمة تنظيمياً
    const branchData = {
        math: ["الرياضيات البحتة", "الرياضيات التطبيقية", "الفيزياء", "الكيمياء", "اللغة العربية واللغات"],
        science: ["الأحياء", "الجيولوجيا والبيئة", "الفيزياء", "الكيمياء", "اللغة العربية واللغات"],
        arts: ["التاريخ", "الجغرافيا", "الفلسفة والمنطق", "علم النفس والاجتماع", "اللغة العربية واللغات"]
    };

    const datesSchedule = [
        "الأحد 14/6/2026 - 09:00 ص", "الإثنين 15/6/2026 - 09:00 ص",
        "الثلاثاء 16/6/2026 - 09:00 ص", "الأربعاء 17/6/2026 - 09:00 ص",
        "الخميس 18/6/2026 - 09:00 ص", "الجمعة 19/6/2026 - 02:00 م",
        "السبت 20/6/2026 - 09:00 ص", "الأحد 21/6/2026 - 09:00 ص",
        "الإثنين 22/6/2026 - 09:00 ص", "الثلاثاء 23/6/2026 - 09:00 ص",
        "الاربعاء 24/6/2026 - الدور الأول 24", "الخميس 25/6/2026 - الدور الثاني 24",
        "السبت 27/6/2026 - الدور الأول 25", "الأحد 28/6/2026 - الدور الثاني 25"
    ];

    const cheeringPhrases = [
        "الله ينور يا بطل! خطوة قوية نحو الحلم 🚀",
        "مستوى أسطوري! استمر في سحق النماذج 🔥",
        "أنت مهندس المستقبل بلا شك، مجهود رائع 📐",
        "الاستمرار هو السر، قفلت نموذج جديد بنجاح 💎",
        "عاش جداً! كل امتحان تحله يقربك من الـ 100% 🎯"
    ];

    let currentBranch = "";

    // تحميل الشعبة المحفوظة عند بدء التحميل
    window.addEventListener('DOMContentLoaded', function() {
        const savedBranch = localStorage.getItem('selectedBranch');
        if (savedBranch && branchData[savedBranch]) {
            selectBranch(savedBranch);
        }
    });

    function selectBranch(branch) {
        currentBranch = branch;
        // حفظ الشعبة في LocalStorage
        localStorage.setItem('selectedBranch', branch);
        
        document.getElementById("selectionScreen").style.display = "none";
        document.getElementById("mainDashboard").style.display = "block";
        document.getElementById("changeBranchBtn").classList.add("show");
        
        generateAccordions(branch);
        loadSavedData();
    }

    function resetBranch() {
        // مسح الشعبة المحفوظة
        localStorage.removeItem('selectedBranch');
        // إزالة جميع البيانات المحفوظة للمواد
        Object.keys(localStorage).forEach(key => {
            if (key.includes(currentBranch)) {
                localStorage.removeItem(key);
            }
        });
        
        currentBranch = "";
        document.getElementById("mainDashboard").style.display = "none";
        document.getElementById("selectionScreen").style.display = "block";
        document.getElementById("changeBranchBtn").classList.remove("show");
        document.getElementById("accordionsContainer").innerHTML = "";
    }

    function generateAccordions(branch) {
        const container = document.getElementById("accordionsContainer");
        container.innerHTML = "";
        const subjects = branchData[branch];

        subjects.forEach((subject, subIndex) => {
            const subId = `${branch}-sub-${subIndex}`;
            
            let html = `
                <div class="subject-accordion">
                    <div class="outer-progress-box">
                        <span>إنجاز مادة: <strong>${subject}</strong></span>
                        <div style="display:flex; align-items:center; width:65%; justify-content:flex-end;">
                            <div class="outer-bar-bg"><div class="outer-bar-fill" id="${subId}-filler"></div></div>
                            <span id="${subId}-counter">0%</span>
                        </div>
                    </div>
                    
                    <div class="subject-badges-container" id="${subId}-badges-container">
                        <!-- الأوسمة سيتم إضافتها ديناميكياً هنا -->
                    </div>
                    
                    <div class="accordion-header" onclick="toggleAccordion(this, '${subId}')">
                        <span>اضغط لاستعراض وتصفح بنك الامتحانات المتاحة</span>
                        <span class="arrow">▼</span>
                    </div>
                    
                    <div class="accordion-content">
                        <table>
                            <tbody id="${subId}-tbody">`;

            // 10 نماذج استرشادية بروابط حقيقية منبثقة ومواعيد
            for (let i = 1; i <= 10; i++) {
                const rowId = `${subId}-model-${i}`;
                html += `
                    <tr data-id="${rowId}" onclick="toggleRow(this, '${subId}')">
                        <td><div class="checkbox-dot"></div> 
                            <a href="https://www.google.com" target="_blank" class="pdf-link" onclick="event.stopPropagation();">
                               افتح PDF: النموذج الاسترشادي المعتمد رقم ${i}
                            </a>
                        </td>
                        <td>🗓️ ${datesSchedule[i-1]}</td>
                    </tr>`;
            }

            // 4 امتحانات دور أول وثاني
            const exams = [
                { name: "امتحان الدور الأول الرسمي لعام 2024", id: "ex24-1", idx: 10 },
                { name: "امتحان الدور الثاني الرسمي لعام 2024", id: "ex24-2", idx: 11 },
                { name: "امتحان الدور الأول الرسمي لعام 2025", id: "ex25-1", idx: 12 },
                { name: "امتحان الدور الثاني الرسمي لعام 2025", id: "ex25-2", idx: 13 }
            ];

            exams.forEach(ex => {
                const rowId = `${subId}-${ex.id}`;
                html += `
                    <tr class="exam-row" data-id="${rowId}" onclick="toggleRow(this, '${subId}')">
                        <td><div class="checkbox-dot"></div> 
                            <a href="https://www.google.com" target="_blank" class="pdf-link" onclick="event.stopPropagation();">
                               🌟 افتح PDF: ${ex.name}
                            </a>
                        </td>
                        <td>🗓️ ${datesSchedule[ex.idx]}</td>
                    </tr>`;
            });

            html += `</tbody></table></div></div>`;
            container.innerHTML += html;
        });
    }

    function toggleAccordion(header, subId) {
        const accordion = header.parentElement;
        const content = accordion.querySelector('.accordion-content');
        const isVisible = content.style.display === "block";

        document.querySelectorAll('.accordion-content').forEach(el => el.style.display = "none");
        document.querySelectorAll('.accordion-header').forEach(el => {
            el.classList.remove('active');
            el.querySelector('.arrow').innerText = "▼";
        });

        if (!isVisible) {
            content.style.display = "block";
            header.classList.add('active');
            header.querySelector('.arrow').innerText = "▲";
        }
    }

    function toggleRow(row, subId) {
        row.classList.toggle('completed');
        const rowId = row.getAttribute('data-id');
        
        if (row.classList.contains('completed')) {
            localStorage.setItem(rowId, 'completed');
            showCheeringToast();
        } else {
            localStorage.removeItem(rowId);
        }
        
        calculateProgress(subId);
        calculateTotalProgress();
    }

    function showCheeringToast() {
        const toast = document.getElementById("toast");
        const randomPhrase = cheeringPhrases[Math.floor(Math.random() * cheeringPhrases.length)];
        toast.innerText = randomPhrase;
        toast.classList.add("show");
        
        setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }

    function calculateProgress(subId) {
        const tbody = document.getElementById(`${subId}-tbody`);
        if (!tbody) return;

        const total = tbody.querySelectorAll('tr').length;
        const checked = tbody.querySelectorAll('tr.completed').length;
        const result = Math.round((checked / total) * 100) || 0;
        
        document.getElementById(`${subId}-filler`).style.width = result + '%';
        document.getElementById(`${subId}-counter`).innerText = result + '%';
        
        // تحديث الأوسمة الفردية لهذه المادة
        updateSubjectBadges(subId, checked, total);
    }

    function updateSubjectBadges(subId, checked, total) {
        const badgesContainer = document.getElementById(`${subId}-badges-container`);
        if (!badgesContainer) return;

        badgesContainer.innerHTML = ""; // مسح الأوسمة السابقة

        const remaining = total - checked;

        // وسام ربع المادة (25%)
        if (checked >= Math.ceil(total * 0.25)) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge unlocked';
            badge.innerHTML = '🥈 ربع المادة';
            badgesContainer.appendChild(badge);
        }

        // وسام نصف المادة (50%)
        if (checked >= Math.ceil(total * 0.50)) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge unlocked';
            badge.innerHTML = '🥇 نصف المادة';
            badgesContainer.appendChild(badge);
        }

        // وسام المقاتل الأخير (متبقي امتحانين أو أقل، وليس 100%)
        if (remaining <= 2 && remaining > 0) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge unlocked';
            badge.innerHTML = `🔥 فاضل ${remaining} ${remaining === 1 ? 'امتحان' : 'امتحانين'}`;
            badgesContainer.appendChild(badge);
        }
    }

    function calculateTotalProgress() {
        const totalAll = document.querySelectorAll(`tbody tr`).length;
        const checkedAll = document.querySelectorAll(`tbody tr.completed`).length;
        const resultAll = Math.round((checkedAll / totalAll) * 100) || 0;
        
        document.getElementById(`total-filler`).style.width = resultAll + '%';
        document.getElementById(`total-counter`).innerText = resultAll + '%';
    }

    function loadSavedData() {
        const rows = document.querySelectorAll('tbody tr');
        rows.forEach(row => {
            const rowId = row.getAttribute('data-id');
            if (localStorage.getItem(rowId) === 'completed') {
                row.classList.add('completed');
            }
        });
        
        const subjects = branchData[currentBranch];
        subjects.forEach((subject, subIndex) => {
            calculateProgress(`${currentBranch}-sub-${subIndex}`);
        });
        calculateTotalProgress();
    }
</script>

</body>
</html>
