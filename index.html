<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الثانوية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #111827 0%, #0f172a 100%);
            color: #f3f4f6;
            padding: 30px;
            border: 2px solid #3b82f6;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
            position: relative;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 20px;
                border-radius: 15px;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .header .main-title {
            font-size: 40px;
            font-weight: 900;
            background: linear-gradient(to left, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* زر تغيير الشعبة */
        .change-branch-btn {
            position: absolute;
            top: -10px;
            left: 0;
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
        }

        .change-branch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        .change-branch-btn.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header .main-title {
                font-size: 28px;
            }

            .change-branch-btn {
                position: absolute;
                top: -5px;
                left: 0;
                padding: 8px 15px;
                font-size: 13px;
            }
        }

        /* شاشة اختيار الشعبة الأولى */
        .selection-screen {
            text-align: center;
            padding: 40px 10px;
        }

        .selection-screen h3 {
            font-size: 22px;
            color: #e5e7eb;
            margin-bottom: 25px;
        }

        .branch-btn {
            background: #1e293b;
            color: #60a5fa;
            border: 2px solid #334155;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
            max-width: 300px;
        }

        .branch-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .branch-btn {
                width: 90%;
                padding: 12px 20px;
                font-size: 16px;
            }
        }

        /* لوحة التحكم والمواد (مخفية في البداية) */
        .main-dashboard {
            display: none;
        }

        /* زر التحميل الموحد */
        .download-all-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #0b0f19;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.35), 0 0 30px rgba(0, 255, 136, 0.2);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .download-all-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.5s ease;
        }

        .download-all-btn:hover::before {
            left: 100%;
        }

        .download-all-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 255, 136, 0.3);
        }

        .download-all-btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .download-all-btn {
                padding: 14px 20px;
                font-size: 14px;
                gap: 8px;
            }
        }

        .total-progress-section {
            background: rgba(59, 130, 246, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-bg {
            background: #111827;
            height: 14px;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            height: 100%;
            width: 0%;
        }

        /* حاوية الأكورديون وبار الإنجاز الخارجي */
        .subject-accordion {
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1f2937;
            background: #1e293b;
        }

        /* رأس المادة الموحد (Unified Header) */
        .subject-header-wrapper {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }

        .subject-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .subject-name {
            font-weight: 700;
            font-size: 16px;
            color: #f3f4f6;
            min-width: 150px;
            text-align: right;
        }

        .subject-progress-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-start;
        }

        .subject-progress-bar {
            flex: 1;
            background: #111827;
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
            min-width: 150px;
        }

        .subject-progress-fill {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            height: 100%;
            width: 0%;
        }

        .subject-progress-text {
            font-size: 14px;
            font-weight: 700;
            color: #60a5fa;
            min-width: 45px;
            text-align: right;
        }

        .accordion-toggle-btn {
            background: none;
            border: none;
            color: #60a5fa;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .accordion-toggle-btn.active {
            transform: rotate(180deg);
            color: #10b981;
        }

        /* حاوية الأوسمة في الهيدر */
        .subject-badges-header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 0;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .subject-badges-header.active {
            max-height: 100px;
            opacity: 1;
        }

        .subject-badge-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #f59e0b;
            color: #fcd34d;
            font-weight: 600;
            animation: slideIn 0.4s ease-out;
            white-space: nowrap;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes completePulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }
        }

        .subject-badge-header.completed {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.3), rgba(16, 185, 129, 0.3));
            border-color: #10b981;
            color: #86efac;
            animation: completePulse 2s infinite;
        }

        .accordion-content {
            display: none;
            background: #111827;
            padding: 10px 15px;
            overflow-x: auto;
        }

        .accordion-content.active {
            display: block;
        }

        /* الجداول الداخلية - مبسطة */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
        }

        tr {
            background: #1e293b;
            cursor: pointer;
        }

        tr:hover {
            background: #222f44;
        }

        td {
            padding: 12px 15px;
            font-size: 14px;
            text-align: right;
        }

        td:first-child {
            border-radius: 8px;
            text-align: right;
        }

        .exam-name {
            color: #60a5fa;
            font-weight: 600;
        }

        /* ستايل عند الإنجاز */
        tr.completed {
            background: rgba(16, 185, 129, 0.15) !important;
        }

        tr.completed td {
            text-decoration: line-through;
            color: #64748b !important;
        }

        tr.completed .exam-name {
            color: #64748b !important;
            text-decoration: line-through;
        }

        .checkbox-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            margin-left: 12px;
            display: inline-block;
            vertical-align: middle;
        }

        tr.completed .checkbox-dot {
            background: #10b981;
            border-color: #10b981;
        }

        /* رسائل التشجيع التلقائية */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 700;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            opacity: 0;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .toast-notification {
                bottom: 10px;
                padding: 10px 20px;
                font-size: 14px;
            }

            .subject-header-row {
                gap: 10px;
            }

            .subject-name {
                min-width: 120px;
                font-size: 14px;
            }

            .subject-progress-text {
                min-width: 40px;
                font-size: 12px;
            }

            table {
                border-spacing: 0 4px;
            }

            td {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div id="toast" class="toast-notification">عاش يا بطل! استمر 💪</div>

<div class="dashboard-container">
    
    <div class="header">
        <button id="changeBranchBtn" class="change-branch-btn" onclick="resetBranch()">تغيير الشعبة 🔄</button>
        <div class="main-title">تحدي الثانوية 🎯</div>
    </div>

    <div id="selectionScreen" class="selection-screen">
        <h3>مرحباً بك يا بطل، اختر شعبتك الدراسية لبدء التحدي:</h3>
        <button class="branch-btn" onclick="selectBranch('math')">📐 علمي رياضة</button>
        <button class="branch-btn" onclick="selectBranch('science')">🧪 علمي علوم</button>
        <button class="branch-btn" onclick="selectBranch('arts')">📚 أدبي</button>
    </div>

    <div id="mainDashboard" class="main-dashboard">
        <a href="https://studentbooks.moe.gov.eg/sec3guideforms/" target="_blank" class="download-all-btn">
            <span>📥</span>
            <span>تحميل جميع النماذج والامتحانات</span>
        </a>

        <div class="total-progress-section">
            <div class="progress-info">
                <span>🚀 إجمالي التقدم في جميع المواد:</span>
                <span id="total-counter">0%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="total-filler"></div>
            </div>
        </div>

        <div id="accordionsContainer"></div>
    </div>

</div>

<script>
    // المواد وتواريخها مقسمة تنظيمياً
    const branchData = {
        math: ["الرياضيات البحتة", "الرياضيات التطبيقية", "الفيزياء", "الكيمياء", "اللغة العربية واللغات"],
        science: ["الأحياء", "الجيولوجيا والبيئة", "الفيزياء", "الكيمياء", "اللغة العربية واللغات"],
        arts: ["التاريخ", "الجغرافيا", "الفلسفة والمنطق", "علم النفس والاجتماع", "اللغة العربية واللغات"]
    };

    const cheeringPhrases = [
        "الله ينور يا بطل! خطوة قوية نحو الحلم 🚀",
        "مستوى أسطوري! استمر في سحق النماذج 🔥",
        "أنت مهندس المستقبل بلا شك، مجهود رائع 📐",
        "الاستمرار هو السر، قفلت نموذج جديد بنجاح 💎",
        "عاش جداً! كل امتحان تحله يقربك من الـ 100% 🎯"
    ];

    let currentBranch = "";

    // تحميل الشعبة المحفوظة عند بدء التحميل
    window.addEventListener('DOMContentLoaded', function() {
        const savedBranch = localStorage.getItem('selectedBranch');
        if (savedBranch && branchData[savedBranch]) {
            selectBranch(savedBranch);
        }
    });

    function selectBranch(branch) {
        currentBranch = branch;
        localStorage.setItem('selectedBranch', branch);
        
        document.getElementById("selectionScreen").style.display = "none";
        document.getElementById("mainDashboard").style.display = "block";
        document.getElementById("changeBranchBtn").classList.add("show");
        
        generateAccordions(branch);
        loadSavedData();
    }

    function resetBranch() {
        localStorage.removeItem('selectedBranch');
        Object.keys(localStorage).forEach(key => {
            if (key.includes(currentBranch)) {
                localStorage.removeItem(key);
            }
        });
        
        currentBranch = "";
        document.getElementById("mainDashboard").style.display = "none";
        document.getElementById("selectionScreen").style.display = "block";
        document.getElementById("changeBranchBtn").classList.remove("show");
        document.getElementById("accordionsContainer").innerHTML = "";
    }

    function generateAccordions(branch) {
        const container = document.getElementById("accordionsContainer");
        container.innerHTML = "";
        const subjects = branchData[branch];

        subjects.forEach((subject, subIndex) => {
            const subId = `${branch}-sub-${subIndex}`;
            
            let html = `
                <div class="subject-accordion" id="${subId}-accordion">
                    <div class="subject-header-wrapper" onclick="toggleAccordion('${subId}')">
                        <div class="subject-header-row">
                            <button class="accordion-toggle-btn" id="${subId}-toggle">▼</button>
                            <div class="subject-progress-wrapper">
                                <span class="subject-progress-text" id="${subId}-counter">0%</span>
                                <div class="subject-progress-bar">
                                    <div class="subject-progress-fill" id="${subId}-filler"></div>
                                </div>
                            </div>
                            <span class="subject-name">${subject}</span>
                        </div>
                        <div class="subject-badges-header" id="${subId}-badges-header">
                            <!-- الأوسمة سيتم إضافتها ديناميكياً هنا -->
                        </div>
                    </div>
                    
                    <div class="accordion-content" id="${subId}-content">
                        <table>
                            <tbody id="${subId}-tbody">`;

            // 10 نماذج استرشادية فقط (بدون تواريخ)
            for (let i = 1; i <= 10; i++) {
                const rowId = `${subId}-model-${i}`;
                html += `
                    <tr data-id="${rowId}" onclick="toggleRow(this, '${subId}')">
                        <td>
                            <div class="checkbox-dot"></div> 
                            <span class="exam-name">النموذج الاسترشادي رقم ${i}</span>
                        </td>
                    </tr>`;
            }

            html += `</tbody></table></div></div>`;
            container.innerHTML += html;
        });
    }

    function toggleAccordion(subId) {
        const accordion = document.getElementById(`${subId}-accordion`);
        const content = document.getElementById(`${subId}-content`);
        const toggle = document.getElementById(`${subId}-toggle`);

        // إغلاق جميع الأكورديونات الأخرى
        document.querySelectorAll('.accordion-content.active').forEach(el => {
            if (el.id !== `${subId}-content`) {
                el.classList.remove('active');
            }
        });
        document.querySelectorAll('.accordion-toggle-btn.active').forEach(btn => {
            if (btn.id !== `${subId}-toggle`) {
                btn.classList.remove('active');
            }
        });

        // تبديل الأكورديون الحالي
        content.classList.toggle('active');
        toggle.classList.toggle('active');
    }

    function toggleRow(row, subId) {
        row.classList.toggle('completed');
        const rowId = row.getAttribute('data-id');
        
        if (row.classList.contains('completed')) {
            localStorage.setItem(rowId, 'completed');
            showCheeringToast();
        } else {
            localStorage.removeItem(rowId);
        }
        
        calculateProgress(subId);
        calculateTotalProgress();
    }

    function showCheeringToast() {
        const toast = document.getElementById("toast");
        const randomPhrase = cheeringPhrases[Math.floor(Math.random() * cheeringPhrases.length)];
        toast.innerText = randomPhrase;
        toast.classList.add("show");
        
        setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }

    function calculateProgress(subId) {
        const tbody = document.getElementById(`${subId}-tbody`);
        if (!tbody) return;

        const total = tbody.querySelectorAll('tr').length;
        const checked = tbody.querySelectorAll('tr.completed').length;
        const result = Math.round((checked / total) * 100) || 0;
        
        document.getElementById(`${subId}-filler`).style.width = result + '%';
        document.getElementById(`${subId}-counter`).innerText = result + '%';
        
        // تحديث الأوسمة الذكية لهذه المادة
        updateSmartBadges(subId, checked, total);
    }

    function updateSmartBadges(subId, checked, total) {
        const badgesContainer = document.getElementById(`${subId}-badges-header`);
        if (!badgesContainer) return;

        badgesContainer.innerHTML = ""; // مسح الأوسمة السابقة

        const remaining = total - checked;
        const percentage = Math.round((checked / total) * 100);

        // إذا تم إنجاز المادة بنسبة 100%
        if (percentage === 100) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge-header completed';
            badge.innerHTML = '🏆 تم الانتهاء وسحق المادة بنجاح!';
            badgesContainer.appendChild(badge);
            badgesContainer.classList.add('active');
            return;
        }

        // إذا تبقى امتحانان أو واحد فقط
        if (remaining <= 2 && remaining > 0) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge-header unlocked';
            if (remaining === 1) {
                badge.innerHTML = '⚡ متبقي امتحان واحد على التقفيل!';
            } else {
                badge.innerHTML = '🔥 متبقي امتحانان فقط!';
            }
            badgesContainer.appendChild(badge);
            badgesContainer.classList.add('active');
            return;
        }

        // الأوسمة العادية (25% و 50%)
        let hasBadges = false;

        // وسام 25%
        if (checked >= Math.ceil(total * 0.25) && percentage < 50) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge-header unlocked';
            badge.innerHTML = '🥈 ربع المادة';
            badgesContainer.appendChild(badge);
            hasBadges = true;
        }

        // وسام 50%
        if (checked >= Math.ceil(total * 0.50) && percentage < 100) {
            const badge = document.createElement('span');
            badge.className = 'subject-badge-header unlocked';
            badge.innerHTML = '🥇 نصف المادة';
            badgesContainer.appendChild(badge);
            hasBadges = true;
        }

        if (hasBadges) {
            badgesContainer.classList.add('active');
        } else {
            badgesContainer.classList.remove('active');
        }
    }

    function calculateTotalProgress() {
        const totalAll = document.querySelectorAll(`tbody tr`).length;
        const checkedAll = document.querySelectorAll(`tbody tr.completed`).length;
        const resultAll = Math.round((checkedAll / totalAll) * 100) || 0;
        
        document.getElementById(`total-filler`).style.width = resultAll + '%';
        document.getElementById(`total-counter`).innerText = resultAll + '%';
    }

    function loadSavedData() {
        const rows = document.querySelectorAll('tbody tr');
        rows.forEach(row => {
            const rowId = row.getAttribute('data-id');
            if (localStorage.getItem(rowId) === 'completed') {
                row.classList.add('completed');
            }
        });
        
        const subjects = branchData[currentBranch];
        subjects.forEach((subject, subIndex) => {
            calculateProgress(`${currentBranch}-sub-${subIndex}`);
        });
        calculateTotalProgress();
    }
</script>

</body>
</html>
